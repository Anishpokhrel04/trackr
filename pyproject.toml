[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trackr"
version = "0.1.0"
description = "A CLI tool for personal financial analysis and transaction tracking"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "matplotlib>=3.5.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]